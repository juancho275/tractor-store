<header class="header">
  <div class="header__container">

    <!-- Logo -->
    <a routerLink="/" class="header__logo">
      <span class="header__logo-icon">🚜</span>
      <span class="header__logo-text">Tractor Store</span>
    </a>

    <!-- Navegación principal -->
    <nav class="header__nav">
      <a routerLink="/explore"
         routerLinkActive="header__nav-link--active"
         class="header__nav-link">
        Catálogo
      </a>
      <a href="https://tractor-store-production.up.railway.app/swagger-ui"
         target="_blank"
         rel="noopener noreferrer"
         class="header__nav-link">
        API Docs
      </a>
    </nav>

    <!-- Auth -->
    <div class="header__auth">
      @if (isLoggedIn()) {
        <span class="header__user-email">{{ userEmail() }}</span>
        <button class="header__auth-btn header__auth-btn--logout" (click)="logout()">
          Salir
        </button>
      } @else {
        <a routerLink="/auth/login" class="header__auth-btn">Entrar</a>
      }
    </div>

    <!-- Carrito -->
    <a routerLink="/checkout" class="header__cart">
      <span class="header__cart-icon">🛒</span>
      @if (showBadge()) {
        <span class="header__cart-badge">{{ cartCount() }}</span>
      }
    </a>

  </div>
</header>
