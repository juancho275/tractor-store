# Production profile — uses environment variables from Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# CORS — frontend en Vercel
spring.web.cors.allowed-origins=${FRONTEND_URL:https://tractor-store-shell.vercel.app}
logging.level.com.tractorstore=INFO

# Mail — para activar envio real de emails en Railway, agregar estas env vars:
# SPRING_MAIL_HOST=smtp.gmail.com
# SPRING_MAIL_PORT=587
# SPRING_MAIL_USERNAME=tu-email@gmail.com
# SPRING_MAIL_PASSWORD=app-password
# Si no se configuran, NotificationService loguea el email en consola solamente.