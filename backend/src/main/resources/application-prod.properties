# Production profile — uses environment variables from Railway
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=tractor-store-backend
# Disable mail health check — SMTP connectivity is tested on send, not on health poll
management.health.mail.enabled=false

# Structured JSON logging (ECS format — legible en Railway y cualquier log aggregator)
logging.structured.format.console=ecs

# CORS — frontend en Vercel
spring.web.cors.allowed-origins=${FRONTEND_URL:https://tractor-store-shell.vercel.app}
logging.level.com.tractorstore=INFO

# Mail — Resend HTTP API (recomendado, usa HTTPS puerto 443):
# RESEND_API_KEY=re_xxxxxxxx
# SPRING_MAIL_FROM=onboarding@resend.dev
# Si no se configura RESEND_API_KEY, NotificationService loguea el email en consola solamente.