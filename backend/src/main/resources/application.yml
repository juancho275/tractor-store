spring:
  application:
    name: tractor-store-backend

  # ===== DATABASE =====
  datasource:
    url: jdbc:postgresql://localhost:5432/tractorstore
    username: postgres
    password: flypassword
    driver-class-name: org.postgresql.Driver

  # ===== JPA =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== VIRTUAL THREADS (Java 21) =====
  threads:
    virtual:
      enabled: true

  # ===== MAIL =====
  # Credentials via env vars: SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, SPRING_MAIL_FROM
  # Without SPRING_MAIL_HOST the JavaMailSender bean is not created → console logging only.
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
    test-connection: false

# ===== SERVER =====
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# ===== OPENAPI / SWAGGER =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    try-it-out-enabled: true


# ===== JWT =====
jwt:
  # Override in production with a 256-bit+ base64-encoded random key via JWT_SECRET env var
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3JldC1rZXktdGhhdC1pcy0yNTYtYml0cy1sb25nLXBsZWFzZS1jaGFuZ2U=}
  expiration-ms: 86400000  # 24 hours

# ===== LOGGING =====
logging:
  level:
    com.tractorstore: DEBUG
    org.springframework.modulith: DEBUG
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"