groups:
  - name: tractor-store-alerts
    interval: 30s
    rules:

      - alert: ApplicationDown
        expr: up{job="tractor-store-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Backend de Tractor Store caído"
          description: "El backend no ha respondido al scraping de Prometheus durante más de 1 minuto."

      - alert: HighApiLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, uri)
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 de API supera 500ms"
          description: "El endpoint {{ $labels.uri }} tiene latencia p95 de {{ $value | humanizeDuration }}."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tasa de errores HTTP 5xx supera el 5%"
          description: "{{ $value | humanizePercentage }} de las peticiones están retornando errores 5xx."

      - alert: HighJvmHeapUsage
        expr: |
          jvm_memory_used_bytes{area="heap"}
          /
          jvm_memory_max_bytes{area="heap"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso de heap JVM supera el 80%"
          description: "El heap JVM está al {{ $value | humanizePercentage }}. Puede indicar un memory leak."
